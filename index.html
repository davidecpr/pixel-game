<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pixel Game</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
<!-- Menu iniziale -->
<section id="menu-screen-section">
  <div id="menu-screen">
    <h1>Pixel Game</h1>
      <nav>
      <button id="btn-editor" class="btn btn-primary">Apri Configuratore</button>
      <button id="btn-play" class="btn btn-primary">Gioca</button>
    </nav>
  </div>
</section>

<!-- Editor -->
<section id="editor-screen-section" class="hidden">
  <div id="editor-screen">
    <div id="editor-sidebar">
        <h2>Palette</h2>
        <div id="palette"></div>
        <hr>
        <button id="save-map" class="btn btn-primary">Salva Mappa</button>
        <label for="load-map" class="btn btn-secondary">Carica da File</label>
        <input type="file" id="load-map" accept=".json" class="hidden">
        <button id="clear-map" class="btn btn-secondary">Pulisci</button>
        <button id="back-menu-1" class="btn btn-secondary">Indietro</button>
    </div>
    <canvas id="editor-canvas"></canvas>
  </div>
</section>

<!-- Play (Selezione Mappa) -->
<section id="map-selection-section" class="hidden">
    <div id="map-selection-container">
      <h2>Scegli una Mappa</h2>
      <div id="map-list-container">
        <!-- L'elenco delle mappe verrà popolato da JS -->
        <p>Nessuna mappa trovata. Crea una mappa nell'editor!</p>
      </div>
      <button id="btn-start-game" class="btn btn-primary" disabled>Avvia Gioco</button>
      <button id="back-menu-2" class="btn btn-secondary">Torna al Menu</button>
    </div>
</section>

<!-- Command (Inserimento Sequenza) -->
<section id="command-screen-section" class="hidden">
    <div id="command-container">
        <h2>Crea Sequenza Comandi</h2>
        <div id="command-panel">
            <div id="keyboard-legend" style="display: flex; justify-content: center; flex-direction: column; align-items: center;">
                <h3>Usa la tastiera</h3>
                <div id="command-legend" class="legend" style="display: flex; align-items: center; justify-items: center;">
                    <div class="legend-grid">
                      <span class="legend-block command-forward">Avanti</span>
                      <span class="legend-block command-right">Destra</span>
                      <span class="legend-block command-left">Sinistra</span>
                      <span class="legend-block command-jump">Salto</span>
                    </div>
                  </div>
            </div>
            <div id="command-sequence">
                <h3>Sequenza</h3>
                <div id="command-list"></div>
            </div>
            <div id="control-buttons">
                <button id="btn-execute" class="btn btn-primary">Esegui Sequenza</button>
                <button id="btn-clear" class="btn btn-secondary">Pulisci</button>
            </div>
        </div>
        <button id="back-to-map-selection" class="btn btn-secondary">Indietro</button>
    </div>
</section>

<!-- Play (Esecuzione Gioco) -->
<section id="play-screen-section" class="hidden">
    <div id="play-screen">
        <div id="game-area">
            <canvas id="game-canvas"></canvas>
            <div id="countdown-overlay" class="hidden">
                <div id="countdown">3</div>
            </div>
            <div id="game-overlay" class="hidden">
                <div id="overlay-message"></div>
                <button id="restart-game-btn" onclick="backToCommandScreen()" class="btn btn-primary">Rigioca</button>
                <button id="back-menu-from-game" class="btn btn-secondary">Torna al Menu</button>
            </div>
        </div>
    </div>
</section>

<!-- Definizione assetList condivisa -->
<script>
    window.assetList = [
        { key: 'G', name: 'Terra',  url: 'https://i.pinimg.com/564x/2a/b1/c3/2ab1c37cfdff720c6de2ddb07328f145.jpg' },
        { key: 'T', name: 'Albero', url: 'https://minecraft.wiki/images/Oak_Sapling_JE14.png?c2c3b' },
        { key: 'W', name: 'Acqua',  url: 'https://i.pinimg.com/474x/96/f8/f0/96f8f0cbf153ba33732c84b18a385cb4.jpg' },
        { key: 'X', name: 'Trofeo', url: 'https://p.novaskin.me/5444504173.png' }
    ];
</script>

<script src="js/game.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
